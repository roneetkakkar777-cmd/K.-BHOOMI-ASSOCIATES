<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A020;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- Gold border -->
  <rect width="64" height="64" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- House roof (triangle) -->
  <polygon points="32,8 52,26 12,26" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- House body -->
  <rect x="18" y="26" width="28" height="22" rx="1" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Door -->
  <rect x="27" y="36" width="10" height="12" rx="2" fill="#1a1a2e"/>

  <!-- Left window -->
  <rect x="20" y="29" width="7" height="6" rx="1" fill="#1a1a2e"/>

  <!-- Right window -->
  <rect x="37" y="29" width="7" height="6" rx="1" fill="#1a1a2e"/>

  <!-- "K" letter at bottom -->
  <text x="32" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">K.B.A</text>
</svg>